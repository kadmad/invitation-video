# Local render worker, pointed at PRODUCTION data over the Tailscale tunnel
# (see docker-compose.prod.yml's Postgres/Redis port note). Runs the admin's
# own backend + worker + renderer + frontend, all talking to production
# Postgres/Redis/R2 instead of local containers. No local postgres/redis/minio
# here on purpose — this stack is additive to production's data, not a
# separate copy of it.
#
# Usage:
#   cp .env.production-worker.example .env.production-worker   # first time, fill in real values
#   docker compose -f docker-compose.local-worker.yml --env-file .env.production-worker up
#   # or: make up-worker
#
# Manual-render jobs auto-dispatch to Celery at checkout (payments.py
# verify_payment) — as soon as this stack's `worker` container connects to
# production Redis it starts draining whatever's queued, oldest first, no
# admin click needed. Run this on multiple machines at once and they
# load-balance the same queue automatically (Redis pop is atomic). If this
# worker dies mid-render, the job is safely requeued for whichever worker
# picks it up next (see celery_app.py). Open http://localhost:5174/admin
# "Renders Awaiting" to watch progress or upload a video manually as an
# override.
#
# backend/frontend here are on 8001/5174 (not 8000/5173) so this stack can
# run ALONGSIDE the regular local dev stack (docker-compose.yml) without
# port collisions — that one is local Postgres/local data, this one is
# production data over Tailscale. They are two different admin panels;
# local dev's :5173/admin will never show production render jobs no matter
# what this stack is doing, because it queries a different database.

# Explicit project name. Without this, Compose derives the project from the
# directory name — the SAME name docker-compose.yml gets — so the two stacks
# share one project and each `up` recreates the other's containers. That is
# what silently killed the production render worker. Pinning the name is what
# actually makes the "runs alongside the dev stack" claim above true.
name: prod-worker

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env.production-worker
    # Restart policy is applied at container CREATE time, not at `up`. If you
    # add/change it, you must `up -d --force-recreate` or the running container
    # keeps the old policy and silently stays dead after a Docker restart.
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1
    volumes:
      - ./backend:/app
    env_file:
      - .env.production-worker
    depends_on:
      - renderer
    # Comes back automatically whenever Docker (re)starts — including at PC
    # boot, as long as Docker Desktop itself is set to launch at login and
    # this container was left running (`up -d`) at least once.
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env.production-worker
    restart: unless-stopped

  renderer:
    build:
      context: ./renderer
      dockerfile: Dockerfile
    ports:
      - "3100:3100"
    # Sized for the Docker Desktop VM, not the host. The VM here is 4 GB (of
    # an 8 GB Mac); the previous 6g limit + 4gb shm could never be satisfied,
    # so Chrome headless got OOM-killed mid-render. Keep these under the VM's
    # memory or renders die with no useful error.
    shm_size: "1gb"
    volumes:
      - ./renderer:/app
      - ./frontend:/frontend
      - /app/node_modules
    environment:
      RENDERER_PORT: 3100
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-2}
      MAX_PARALLEL_JOBS: ${MAX_PARALLEL_JOBS:-1}
    deploy:
      resources:
        limits:
          memory: 3g
    restart: unless-stopped
