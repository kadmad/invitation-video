# Production stack. Pulls pre-built images from GHCR (built by
# .github/workflows/deploy.yml) instead of building from source, runs
# without --reload/dev bind-mounts, and keeps postgres/redis off the
# host's public network entirely — only Caddy (80/443) is exposed.
#
# Rendering happens on a local worker (not on this server) and storage is
# R2 (S3-compatible), not MinIO — so this stack no longer runs `worker`,
# `renderer`, or `minio` services. The local worker needs its own way to
# reach this server's Redis (broker) and Postgres (job status writes) —
# do NOT publish those ports to the public internet; use a Tailscale/
# WireGuard tunnel between the server and the local worker machine instead.
#
# Usage on the server:
#   docker compose -f docker-compose.prod.yml --env-file .env pull
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Set GHCR_NAMESPACE in .env to your "ghcr.io/<owner>/<repo>" prefix (see
# DEPLOY.md) — the workflow pushes images there.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-invitation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invitation_secret}
      POSTGRES_DB: ${POSTGRES_DB:-invitation_video}
    ports:
      # Bound to the tailnet IP only (TAILSCALE_IP in .env) — reachable from
      # the local render worker over the tunnel, never from the public
      # internet (Caddy is the only service on the public interface).
      - "${TAILSCALE_IP}:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-invitation}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${TAILSCALE_IP}:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ${GHCR_NAMESPACE}-backend:latest
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    image: ${GHCR_NAMESPACE}-frontend:latest
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
  caddy-data:
  caddy-config:
