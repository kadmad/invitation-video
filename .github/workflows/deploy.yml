name: Build and deploy

# Manual trigger only, on purpose — the app is under heavy active
# development right now, so pushes to any branch should NOT auto-deploy to
# production. Run this from the Actions tab when you actually want to ship.
on:
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      namespace: ${{ steps.namespace.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image namespace
        id: namespace
        run: echo "value=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.namespace.outputs.value }}-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ steps.namespace.outputs.value }}-frontend:latest
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file and Caddy config to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "docker-compose.prod.yml,ops/Caddyfile"
          target: ${{ secrets.DEPLOY_PATH || '/opt/invitation-video' }}
          strip_components: 0

      - name: Pull images, run migrations, restart stack
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '/opt/invitation-video' }}
            export GHCR_NAMESPACE=${{ needs.build-and-push.outputs.namespace }}
            docker compose -f docker-compose.prod.yml --env-file .env pull
            docker compose -f docker-compose.prod.yml --env-file .env run --rm backend alembic upgrade head
            docker compose -f docker-compose.prod.yml --env-file .env up -d

            # The Caddyfile is a read-only bind mount, so `up -d` does not
            # restart Caddy when only its contents changed — the old config
            # stays live in memory and new routes (e.g. /sitemap.xml) 404.
            # Reload gracefully; fall back to a restart if the reload fails.
            docker compose -f docker-compose.prod.yml --env-file .env exec -T caddy \
              caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile \
              || docker compose -f docker-compose.prod.yml --env-file .env restart caddy

            # Reclaim disk. Deliberately conservative: `until=168h` keeps the
            # last 7 days of images so a rollback to a recent build is still
            # possible without re-pulling, while stopping older builds and
            # build cache from silently filling the droplet's small disk.
            echo "--- disk before prune ---"; df -h / | tail -1
            docker image prune -f                                  # dangling (superseded :latest)
            docker image prune -af --filter "until=168h"           # unused images older than 7d
            docker builder prune -f --filter "until=168h"          # stale build cache
            docker container prune -f --filter "until=168h"        # exited one-off containers
            echo "--- disk after prune ---"; df -h / | tail -1
