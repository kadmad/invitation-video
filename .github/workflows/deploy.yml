name: Build and deploy

# Manual trigger only, on purpose — the app is under heavy active
# development right now, so pushes to any branch should NOT auto-deploy to
# production. Run this from the Actions tab when you actually want to ship.
on:
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      namespace: ${{ steps.namespace.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image namespace
        id: namespace
        run: echo "value=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend (also used by the worker service)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.namespace.outputs.value }}-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ steps.namespace.outputs.value }}-frontend:latest

      - name: Build and push renderer
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./renderer/Dockerfile.prod
          push: true
          tags: ${{ steps.namespace.outputs.value }}-renderer:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file and Caddy config to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "docker-compose.prod.yml,ops/Caddyfile"
          target: ${{ secrets.DEPLOY_PATH || '/opt/invitation-video' }}
          strip_components: 0

      - name: Pull images, run migrations, restart stack
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '/opt/invitation-video' }}
            export GHCR_NAMESPACE=${{ needs.build-and-push.outputs.namespace }}
            docker compose -f docker-compose.prod.yml --env-file .env pull
            docker compose -f docker-compose.prod.yml --env-file .env run --rm backend alembic upgrade head
            docker compose -f docker-compose.prod.yml --env-file .env up -d
            docker image prune -f
