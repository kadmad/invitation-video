services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-invitation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invitation_secret}
      POSTGRES_DB: ${POSTGRES_DB:-invitation_video}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-invitation}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c '
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin123};
      mc mb local/$${S3_BUCKET_NAME:-invitation-video} --ignore-existing;
      mc anonymous set download local/$${S3_BUCKET_NAME:-invitation-video}/fonts;
      mc anonymous set download local/$${S3_BUCKET_NAME:-invitation-video}/renders;
      echo CORS configured via MINIO_API_CORS_ALLOW_ORIGIN env var;
      exit 0;
      '

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      # Empty by default = identical to unset, i.e. normal behavior (API_URL
      # inferred from the browser's own host:8000). scripts/demo-ngrok.sh
      # exports VITE_API_URL=/api in the shell before `up` to switch this one
      # run into single-tunnel proxy mode, without touching .env.
      VITE_API_URL: ${VITE_API_URL:-}

  renderer:
    build:
      context: ./renderer
      dockerfile: Dockerfile
    ports:
      # Host port shifted off the default 3100 — that port is reserved for
      # docker-compose.local-worker.yml's renderer (wired to production),
      # which stays on its standard port so it can run alongside this dev
      # stack without a conflict. Container-internal calls (renderer:3100
      # over the Docker network) are unaffected either way.
      - "3101:3100"
    shm_size: "4gb"
    volumes:
      - ./renderer:/app
      - ./frontend:/frontend
      - /app/node_modules
    environment:
      RENDERER_PORT: 3100
      RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-4}
      MAX_PARALLEL_JOBS: ${MAX_PARALLEL_JOBS:-2}
    deploy:
      resources:
        limits:
          memory: 6g
    depends_on:
      minio-init:
        condition: service_completed_successfully

volumes:
  pg-data:
  redis-data:
  minio-data:
