server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress at origin too, not only at the Caddy edge — keeps the benefit
    # if anything ever talks to this container directly, and costs nothing.
    # Images/video are already compressed formats, so they're excluded.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # SPA fallback — client-side routing (React Router) owns everything
    # that isn't a real static file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed build assets; index.html itself is never cached so
    # deploys are picked up immediately.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Root-level static files (logo, favicon) are NOT content-hashed, so they
    # can't be marked immutable — a week is long enough to stop re-downloading
    # the logo on every visit, short enough that a rebrand propagates quickly.
    location ~* ^/(logo|logo-mark|logo-nav|favicon)\.(png|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # robots.txt is a real static file. sitemap.xml deliberately is NOT —
    # it's generated by the backend and routed there by Caddy, so it must not
    # be matched here (a stale rule made it 404 instead of falling through).
    location = /robots.txt {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
