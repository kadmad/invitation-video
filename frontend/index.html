<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f6ef7" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="image" href="/logo.webp" type="image/webp" />

    <title>Bring My Matter — Online Invitation Video Maker for Indian Weddings</title>
    <meta
      name="description"
      content="Create wedding, engagement, birthday and housewarming video invitations online. Pick a template, add your names, dates and photos in English, Hindi or Gujarati, and download an HD video and PDF card in minutes."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://bringmymatter.com/" />

    <!-- Font loading: preconnect early, load non-blocking (avoids the render-blocking
         @import that used to sit in index.css and delay first paint on mobile). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      />
    </noscript>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bring My Matter" />
    <meta property="og:title" content="Bring My Matter — Online Invitation Video Maker" />
    <meta
      property="og:description"
      content="Design and download HD video invitations and PDF cards for weddings, engagements, birthdays and housewarmings — in English, Hindi or Gujarati."
    />
    <meta property="og:url" content="https://bringmymatter.com/" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:image" content="https://bringmymatter.com/logo.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bring My Matter — Online Invitation Video Maker" />
    <meta name="twitter:image" content="https://bringmymatter.com/logo.png" />
    <meta
      name="twitter:description"
      content="Design and download HD video invitations and PDF cards for weddings, engagements, birthdays and housewarmings."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Bring My Matter",
        "url": "https://bringmymatter.com",
        "logo": "https://bringmymatter.com/logo.png",
        "image": "https://bringmymatter.com/logo.png",
        "description": "Online invitation video and card maker for Indian weddings and celebrations.",
        "areaServed": "IN",
        "knowsLanguage": ["en", "hi", "gu"],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "email": "support@bringmymatter.com",
          "availableLanguage": ["en", "hi", "gu"]
        }
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Bring My Matter",
        "url": "https://bringmymatter.com",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "description": "Create and download personalised HD video invitations and PDF cards for Indian weddings, engagements, birthdays and housewarmings.",
        "inLanguage": ["en", "hi", "gu"],
        "offers": {
          "@type": "Offer",
          "priceCurrency": "INR",
          "availability": "https://schema.org/InStock"
        }
      }
    </script>
    <!-- Google tag (gtag.js) — loads on every hostname.
         There used to be a production-hostname gate here so local dev, the
         Tailscale prod-worker stack on :5174 and LAN IPs stayed out of the
         live property. It was removed deliberately: the trade is that local
         browsing now shows up in GA, which is accepted so that nothing about
         the tag is conditional while traffic is being verified. -->
    <script>
      (function () {
        var GA_ID = 'G-BCZ263H3YZ';

        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { dataLayer.push(arguments); };
        gtag('js', new Date());
        // Page views are sent from src/lib/analytics.ts instead: this is a
        // SPA, so gtag's automatic hit only ever fires for the first URL and
        // every client-side navigation after it went unreported. Leaving the
        // automatic hit on would double-count the initial load.
        gtag('config', GA_ID, { send_page_view: false });

        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
        document.head.appendChild(s);
      })();
    </script>

  </head>
  <body>
    <div id="root"></div>
    <!-- defer: only needed at checkout, shouldn't block initial HTML parse/paint -->
    <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
